name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'config/trip.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      BARI_REPO: ${{ github.repository }}
      HAS_KEYSTORE: ${{ secrets.BARI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Version numbers continue after the 2.0.1-2.0.2 test builds made before the move to this repo.
      - name: Set version
        run: echo "BARI_VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Without a release key the APK is signed with the runner's debug key.
      # Caching it keeps the signature stable, so new builds install over old ones.
      - name: Restore debug signing key
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bari-debug-keystore-v1

      - name: Decode release signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.BARI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bari-release.jks"
          echo "BARI_KEYSTORE_FILE=$RUNNER_TEMP/bari-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build release APK
        env:
          BARI_KEYSTORE_PASSWORD: ${{ secrets.BARI_KEYSTORE_PASSWORD }}
          BARI_KEY_ALIAS: ${{ secrets.BARI_KEY_ALIAS }}
          BARI_KEY_PASSWORD: ${{ secrets.BARI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        id: apk
        run: |
          VERSION="2.0.${BARI_VERSION_CODE}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Bari.apk
          cp dist/Bari.apk "dist/Bari-v${VERSION}.apk"
          ls -la dist
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Bari-${{ steps.apk.outputs.version }}
          path: android/dist/Bari.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          TAG="v${VERSION}"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          **Bari ${VERSION}** – skrydžių kainų stebėjimas kelionei į Barį.

          ### Įdiegimas telefone
          1. Atsisiųskite **Bari.apk** (žemiau, „Assets“).
          2. Atidarykite failą ir leiskite diegti iš šio šaltinio („Install unknown apps“).
          3. Paleiskite **Bari** ir leiskite pranešimus – programa pati tikrins kainas fone.

          Pastovi nuoroda į naujausią versiją:
          https://github.com/${GH_REPO}/releases/latest/download/Bari.apk

          Commit: ${GITHUB_SHA::7} (${GITHUB_REF_NAME})
          NOTES
          gh release create "$TAG" dist/Bari.apk "dist/Bari-v${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Bari ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

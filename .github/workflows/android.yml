name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'config/trip.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      BARI_REPO: ${{ github.repository }}
      HAS_KEYSTORE: ${{ secrets.BARI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Version numbers continue after the 2.0.1-2.0.2 test builds made before the move to this repo.
      - name: Set version
        run: echo "BARI_VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Every APK must be signed with the same key, otherwise Android refuses to update the installed app.
      # Option 1: your own key in repository secrets (BARI_KEYSTORE_BASE64, BARI_KEYSTORE_PASSWORD, BARI_KEY_ALIAS, BARI_KEY_PASSWORD).
      - name: Use signing key from secrets
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.BARI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BARI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BARI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BARI_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bari-release.jks"
          {
            echo "BARI_KEYSTORE_FILE=$RUNNER_TEMP/bari-release.jks"
            echo "BARI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BARI_KEY_ALIAS=$KEY_ALIAS"
            echo "BARI_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      # Option 2 (default): a key generated once by CI and kept in the Actions cache
      # (kept alive by keep-signing-key.yml). Its password is random and never leaves the cache.
      - name: Restore CI signing key
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bari-signing
          key: bari-signing-key-v1

      - name: Prepare CI signing key
        if: env.HAS_KEYSTORE != 'true'
        run: |
          DIR="$HOME/.bari-signing"
          if [ ! -f "$DIR/bari.jks" ]; then
            echo "No cached signing key – creating one (first build only)."
            mkdir -p "$DIR"
            openssl rand -hex 24 > "$DIR/pass"
            keytool -genkeypair -noprompt -keystore "$DIR/bari.jks" -alias bari -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$(cat "$DIR/pass")" -keypass "$(cat "$DIR/pass")" -dname "CN=Bari, O=sparnai, C=LT"
          fi
          PASS="$(cat "$DIR/pass")"
          echo "::add-mask::$PASS"
          {
            echo "BARI_KEYSTORE_FILE=$DIR/bari.jks"
            echo "BARI_KEYSTORE_PASSWORD=$PASS"
            echo "BARI_KEY_ALIAS=bari"
            echo "BARI_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"
          echo "Signing certificate:"
          keytool -list -v -keystore "$DIR/bari.jks" -storepass "$PASS" | grep -E "SHA256:" | head -1

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :core:test

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        id: apk
        run: |
          VERSION="2.0.${BARI_VERSION_CODE}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Bari.apk
          cp dist/Bari.apk "dist/Bari-v${VERSION}.apk"
          ls -la dist
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Android only installs an update when it is signed with the same certificate as the installed app.
      # Compare with the published releases and refuse to publish an APK that phones could not install.
      - name: Check signature against published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          cert() { "$TOOLS/apksigner" verify --print-certs "$1" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}'; }
          "$TOOLS/aapt2" dump badging dist/Bari.apk | head -1
          NEW="$(cert dist/Bari.apk)"
          echo "NEW APK certificate: $NEW"
          for tag in $(gh release list --limit 6 --json tagName --jq '.[].tagName'); do
            mkdir -p "$RUNNER_TEMP/prev/$tag"
            if gh release download "$tag" --pattern Bari.apk --dir "$RUNNER_TEMP/prev/$tag" --clobber; then
              echo "$tag certificate: $(cert "$RUNNER_TEMP/prev/$tag/Bari.apk")"
            fi
          done
          LATEST="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$LATEST" ] && [ -f "$RUNNER_TEMP/prev/$LATEST/Bari.apk" ]; then
            OLD="$(cert "$RUNNER_TEMP/prev/$LATEST/Bari.apk")"
            if [ "$OLD" = "$NEW" ]; then
              echo "OK: same certificate as $LATEST – installs over it."
            elif [ "$IS_MAIN" = "true" ]; then
              echo "::error::Signing certificate differs from $LATEST – phones could not update. Not publishing."
              exit 1
            else
              echo "::warning::Signing certificate differs from $LATEST."
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Bari-${{ steps.apk.outputs.version }}
          path: android/dist/Bari.apk

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          TAG="v${VERSION}"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          **Bari ${VERSION}** – skrydžių kainų stebėjimas kelionei į Barį.

          ### Įdiegimas telefone
          1. Atsisiųskite **Bari.apk** (žemiau, „Assets“).
          2. Atidarykite failą ir leiskite diegti iš šio šaltinio („Install unknown apps“).
          3. Paleiskite **Bari** ir leiskite pranešimus – programa pati tikrins kainas fone.

          Pastovi nuoroda į naujausią versiją:
          https://github.com/${GH_REPO}/releases/latest/download/Bari.apk

          Commit: ${GITHUB_SHA::7} (${GITHUB_REF_NAME})
          NOTES
          gh release create "$TAG" dist/Bari.apk "dist/Bari-v${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Bari ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

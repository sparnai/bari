name: Keep signing key

# GitHub removes Actions caches that are not used for 7 days. The APK signing key lives in the cache,
# so it is read every 3 days – otherwise the next APK could not be installed over the current app.
on:
  schedule:
    - cron: '41 3 */3 * *'
  workflow_dispatch:

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - name: Read cached signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.bari-signing
          key: bari-signing-key-v1

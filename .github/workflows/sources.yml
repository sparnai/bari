name: Price sources

# Live check that every price source (Ryanair, Google Flights, Trenitalia, FlixBus) still works.
# Informational only: it never fails the build.
on:
  push:
    paths:
      - 'android/core/**'
      - 'config/trip.json'
      - '.github/workflows/sources.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Check all trip segments
        continue-on-error: true
        run: ./gradlew --no-daemon -q :core:run --args="check config/trip.json"

      - name: Discover Ryanair connections
        continue-on-error: true
        run: ./gradlew --no-daemon -q :core:run --args="discover"

      - name: Warsaw options (bus + flights)
        continue-on-error: true
        run: |
          ./gradlew --no-daemon -q :core:run --args="bus Vilnius Warsaw 2026-12-26"
          ./gradlew --no-daemon -q :core:run --args="bus Vilnius Warsaw 2026-12-25"
          ./gradlew --no-daemon -q :core:run --args="bus Warsaw Vilnius 2027-01-03"
          ./gradlew --no-daemon -q :core:run --args="ryanair WMI BRI 2026-12-26"
          ./gradlew --no-daemon -q :core:run --args="ryanair WAW BRI 2026-12-26"
          ./gradlew --no-daemon -q :core:run --args="ryanair BRI WMI 2027-01-03"

      - name: Turin and Budapest options
        continue-on-error: true
        run: |
          ./gradlew --no-daemon -q :core:run --args="ryanair-day VNO TRN 2026-12-26"
          ./gradlew --no-daemon -q :core:run --args="ryanair-day TRN BRI 2026-12-26"
          ./gradlew --no-daemon -q :core:run --args="ryanair-day BRI TRN 2027-01-02"
          ./gradlew --no-daemon -q :core:run --args="ryanair-day TRN VNO 2027-01-02"
          ./gradlew --no-daemon -q :core:run --args="ryanair-day TRN VNO 2027-01-03"
          ./gradlew --no-daemon -q :core:run --args="ryanair-day VNO BUD 2026-12-26"
          ./gradlew --no-daemon -q :core:run --args="ryanair-day BUD BRI 2026-12-26"
          ./gradlew --no-daemon -q :core:run --args="ryanair-day BRI BUD 2027-01-03"
          ./gradlew --no-daemon -q :core:run --args="ryanair-day BUD VNO 2027-01-03"
          ./gradlew --no-daemon -q :core:run --args="google VNO BUD 2026-12-26"
          ./gradlew --no-daemon -q :core:run --args="google BUD BRI 2026-12-26"
          ./gradlew --no-daemon -q :core:run --args="google BRI BUD 2027-01-03"
          ./gradlew --no-daemon -q :core:run --args="google BUD VNO 2027-01-03"

      - name: Google Flights page sample
        continue-on-error: true
        run: |
          ./gradlew --no-daemon -q :core:run --args="google VNO BRI 2026-12-26 2027-01-03"
          ./gradlew --no-daemon -q :core:run --args="google VNO FCO 2026-12-26"
          ./gradlew --no-daemon -q :core:run --args="google VNO VIE 2026-12-26"

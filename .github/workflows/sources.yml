name: Price sources

# Live check that every price source (Ryanair, Google Flights, Trenitalia, FlixBus) still works.
# Informational only: it never fails the build.
on:
  push:
    paths:
      - 'android/core/**'
      - 'config/trip.json'
      - '.github/workflows/sources.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Check all trip segments
        continue-on-error: true
        run: ./gradlew --no-daemon -q :core:run --args="check config/trip.json"

      - name: Discover Ryanair connections
        continue-on-error: true
        run: ./gradlew --no-daemon -q :core:run --args="discover"

      - name: Google Flights page sample
        continue-on-error: true
        run: |
          ./gradlew --no-daemon -q :core:run --args="google VNO BRI 2026-12-26"
          ./gradlew --no-daemon -q :core:run --args="google VIE VNO 2027-01-03"

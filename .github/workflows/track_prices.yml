name: Price tracker

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'config/trip.json'
      - 'tracker/**'
      - '.github/workflows/track_prices.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tracker/requirements.txt

      - name: Tests
        run: python -m unittest discover -s tracker -p "test_*.py" -v

      - name: Check prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker/flight_tracker.py

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          if git diff --staged --quiet; then
            echo "Pokyčių nėra"
            exit 0
          fi
          git commit -m "Kainų atnaujinimas $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
